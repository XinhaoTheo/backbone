[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backbone-review"
version = "0.1.0"
description = "Source-backed clinical review with reproducible calculations"
requires-python = ">=3.12"
dependencies = ["openai>=3.29,<4", "pydantic>=2.12", "python-dotenv>=1.1"]

[project.scripts]
backbone = "backbone.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backbone"]

[dependency-groups]
dev = ["pytest>=8.3", "mypy>=1.15", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
